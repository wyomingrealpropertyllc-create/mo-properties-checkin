<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MO Properties - Guest Check-In & Compliance</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind Config for Brand Colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              600: '#1d4ed8',
              700: '#1e40af',
              800: '#1e3a8a',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & ReactDOM (Development version for fast inline compilation) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .signature-canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col justify-between">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // 📧 HOST NOTIFICATION EMAIL ADDRESS
    // Submissions are delivered directly to your inbox via FormSubmit API.
    // =========================================================================
    const HOST_NOTIFICATION_EMAIL = 'wyomingrealpropertyllc@gmail.com';

    function App() {
      // 2-Step Registration State
      const [step, setStep] = useState(1);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [signatureMode, setSignatureMode] = useState('type'); // 'type' or 'draw'

      // Form State
      const [formData, setFormData] = useState({
        bookingCode: '',
        checkInDate: '',
        checkOutDate: '',
        primaryGuestName: '',
        mobilePhone: '',
        email: '',
        additionalOccupants: '',
        hasVehicle: 'no',
        vehicleMakeModel: '',
        vehiclePlate: '',
        vehicleState: '',
        agreedSafetyPolicy: true,
        agreedMaintenancePolicy: true,
        typedSignature: '',
        drawnSignatureData: '',
        submittedAt: ''
      });

      // Canvas reference for drawn signatures
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));
      };

      // Refresh Lucide Icons on view updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [step, isSubmitted, signatureMode]);

      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        ctx.beginPath();
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#0f172a';
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.stroke();
      };

      const stopDrawing = () => {
        if (!isDrawing) return;
        setIsDrawing(false);
        if (canvasRef.current) {
          setFormData(prev => ({
            ...prev,
            drawnSignatureData: canvasRef.current.toDataURL()
          }));
        }
      };

      const clearSignature = () => {
        const canvas = canvasRef.current;
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          setFormData(prev => ({ ...prev, drawnSignatureData: '' }));
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        
        if (signatureMode === 'type' && !formData.typedSignature.trim()) {
          alert('Please enter your full legal name as your digital signature.');
          return;
        }

        setIsSubmitting(true);
        const timestamp = new Date().toLocaleString('en-US', { timeZoneName: 'short' });
        
        const payload = {
          _subject: `New Guest Check-In: ${formData.primaryGuestName || 'Guest'} (${formData.bookingCode || 'No Ref'})`,
          "Booking Code": formData.bookingCode || 'N/A',
          "Check-In Date": formData.checkInDate || 'N/A',
          "Check-Out Date": formData.checkOutDate || 'N/A',
          "Primary Guest Name": formData.primaryGuestName,
          "Direct Mobile Phone": formData.mobilePhone,
          "Email Address": formData.email,
          "Additional Occupants": formData.additionalOccupants || 'None listed',
          "Has Vehicle": formData.hasVehicle,
          "Vehicle Details": formData.hasVehicle === 'yes' ? `${formData.vehicleMakeModel} (${formData.vehiclePlate} / ${formData.vehicleState})` : 'No vehicle registered',
          "Safety & Compliance Consent": formData.agreedSafetyPolicy ? "Agreed" : "Not Agreed",
          "Maintenance Access Consent": formData.agreedMaintenancePolicy ? "Agreed" : "Not Agreed",
          "Digital Signature": signatureMode === 'type' ? formData.typedSignature : "Drawn Signature Attached",
          "Submission Timestamp": timestamp
        };

        // Send submission to host email via FormSubmit in background
        try {
          fetch(`https://formsubmit.co/ajax/${HOST_NOTIFICATION_EMAIL}`, {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
          }).catch(err => console.warn('FormSubmit notification error:', err));
        } catch (err) {
          console.warn('FormSubmit AJAX send attempt error:', err);
        }

        // Immediately transition to the Thank You / Confirmation screen
        setFormData(prev => ({ ...prev, submittedAt: timestamp }));
        setIsSubmitting(false);
        setIsSubmitted(true);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Header Bar */}
          <header className="bg-slate-900 text-white shadow-md sticky top-0 z-30">
            <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center font-bold text-white text-lg shadow-inner">
                  MO
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-bold leading-tight">MO Properties</h1>
                  <p className="text-xs text-slate-400">Guest Stay & Compliance Portal</p>
                </div>
              </div>

              {formData.bookingCode && (
                <div className="hidden sm:block text-right bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                  <span className="text-[10px] uppercase tracking-wider text-slate-400 block font-semibold">Reservation #</span>
                  <span className="text-xs font-mono text-brand-100 font-bold">{formData.bookingCode}</span>
                </div>
              )}
            </div>
          </header>

          {}
          <main className="max-w-3xl mx-auto px-4 py-6 sm:py-10 w-full flex-grow">
            {!isSubmitted ? (
              <div className="bg-white rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden">
                
                {/* Progress Header */}
                <div className="bg-slate-900 px-6 py-4 text-white border-b border-slate-800 flex items-center justify-between">
                  <div>
                    <span className="text-xs uppercase font-bold text-brand-600 tracking-wider">Step {step} of 2</span>
                    <h2 className="text-lg font-bold">
                      {step === 1 ? 'Page 1: Stay & Guest Details' : 'Page 2: Policies & Digital Signature'}
                    </h2>
                  </div>
                  <div className="flex space-x-1.5">
                    <div className={`w-8 h-2 rounded-full transition-all duration-300 ${step >= 1 ? 'bg-brand-600' : 'bg-slate-700'}`}></div>
                    <div className={`w-8 h-2 rounded-full transition-all duration-300 ${step >= 2 ? 'bg-brand-600' : 'bg-slate-700'}`}></div>
                  </div>
                </div>

                <form onSubmit={step === 2 ? handleSubmit : (e) => { e.preventDefault(); setStep(2); }} className="p-6 sm:p-8 space-y-6">
                  
                  {/* ========================================================= */}
                  {/* PAGE 1: STAY & GUEST REGISTRATION DETAILS                 */}
                  {/* ========================================================= */}
                  {step === 1 && (
                    <div className="space-y-6">
                      
                      {/* Reservation Information */}
                      <div className="bg-slate-50 p-4 sm:p-5 rounded-xl border border-slate-200 space-y-4">
                        <div className="flex items-center text-slate-900 font-bold text-sm border-b pb-2 border-slate-200">
                          <i data-lucide="key" className="w-4 h-4 mr-2 text-brand-600"></i>
                          Reservation Details
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">
                              Confirmation / Booking # <span className="text-rose-500">*</span>
                            </label>
                            <input
                              type="text"
                              name="bookingCode"
                              value={formData.bookingCode}
                              onChange={handleChange}
                              placeholder="e.g. HM123456"
                              className="w-full text-sm px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-brand-600 focus:outline-none"
                              required
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">
                              Check-In Date <span className="text-rose-500">*</span>
                            </label>
                            <input
                              type="date"
                              name="checkInDate"
                              value={formData.checkInDate}
                              onChange={handleChange}
                              className="w-full text-sm px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-brand-600 focus:outline-none"
                              required
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">
                              Check-Out Date <span className="text-rose-500">*</span>
                            </label>
                            <input
                              type="date"
                              name="checkOutDate"
                              value={formData.checkOutDate}
                              onChange={handleChange}
                              className="w-full text-sm px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-brand-600 focus:outline-none"
                              required
                            />
                          </div>
                        </div>
                      </div>

                      {/* Primary Guest Contact Information */}
                      {}
                      <div className="bg-slate-50 p-4 sm:p-5 rounded-xl border border-slate-200 space-y-4">
                        <div className="flex items-center text-slate-900 font-bold text-sm border-b pb-2 border-slate-200">
                          <i data-lucide="user" className="w-4 h-4 mr-2 text-brand-600"></i>
                          Primary Guest Information
                        </div>

                        <div className="space-y-4">
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">
                              Full Legal Name <span className="text-rose-500">*</span>
                            </label>
                            <input
                              type="text"
                              name="primaryGuestName"
                              value={formData.primaryGuestName}
                              onChange={handleChange}
                              placeholder="As shown on government identification"
                              className="w-full text-sm px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-brand-600 focus:outline-none"
                              required
                            />
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">
                                Direct Mobile Phone # <span className="text-rose-500">*</span>
                              </label>
                              <input
                                type="tel"
                                name="mobilePhone"
                                value={formData.mobilePhone}
                                onChange={handleChange}
                                placeholder="(555) 000-0000"
                                className="w-full text-sm px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-brand-600 focus:outline-none"
                                required
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">
                                Email Address <span className="text-rose-500">*</span>
                              </label>
                              <input
                                type="email"
                                name="email"
                                value={formData.email}
                                onChange={handleChange}
                                placeholder="guest@example.com"
                                className="w-full text-sm px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-brand-600 focus:outline-none"
                                required
                              />
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* Additional Occupants & Vehicle Registration */}
                      {}
                      <div className="bg-slate-50 p-4 sm:p-5 rounded-xl border border-slate-200 space-y-4">
                        <div className="flex items-center text-slate-900 font-bold text-sm border-b pb-2 border-slate-200">
                          <i data-lucide="users" className="w-4 h-4 mr-2 text-brand-600"></i>
                          Occupants & Vehicle
                        </div>

                        <div className="space-y-4">
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">
                              Additional Adult Occupants (Names)
                            </label>
                            <textarea
                              name="additionalOccupants"
                              value={formData.additionalOccupants}
                              onChange={handleChange}
                              placeholder="Enter full names of all other adult guests staying in the property"
                              rows="2"
                              className="w-full text-sm px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-600 focus:outline-none resize-none"
                            ></textarea>
                          </div>

                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">
                              Will you have a vehicle on site?
                            </label>
                            <div className="flex space-x-4 mt-1">
                              <label className="flex items-center text-xs text-slate-700 cursor-pointer">
                                <input
                                  type="radio"
                                  name="hasVehicle"
                                  value="yes"
                                  checked={formData.hasVehicle === 'yes'}
                                  onChange={handleChange}
                                  className="mr-2 text-brand-600 focus:ring-brand-600"
                                />
                                Yes
                              </label>
                              <label className="flex items-center text-xs text-slate-700 cursor-pointer">
                                <input
                                  type="radio"
                                  name="hasVehicle"
                                  value="no"
                                  checked={formData.hasVehicle === 'no'}
                                  onChange={handleChange}
                                  className="mr-2 text-brand-600 focus:ring-brand-600"
                                />
                                No
                              </label>
                            </div>
                          </div>

                          {formData.hasVehicle === 'yes' && (
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                              <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Make / Model / Color</label>
                                <input
                                  type="text"
                                  name="vehicleMakeModel"
                                  value={formData.vehicleMakeModel}
                                  onChange={handleChange}
                                  placeholder="e.g. Toyota RAV4 (Silver)"
                                  className="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-600 focus:outline-none"
                                />
                              </div>
                              <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">License Plate #</label>
                                <input
                                  type="text"
                                  name="vehiclePlate"
                                  value={formData.vehiclePlate}
                                  onChange={handleChange}
                                  placeholder="ABC-1234"
                                  className="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-600 focus:outline-none"
                                />
                              </div>
                              <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">State</label>
                                <input
                                  type="text"
                                  name="vehicleState"
                                  value={formData.vehicleState}
                                  onChange={handleChange}
                                  placeholder="e.g. CA / WY"
                                  className="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-600 focus:outline-none"
                                />
                              </div>
                            </div>
                          )}
                        </div>
                      </div>

                      <div className="flex justify-end pt-2">
                        <button
                          type="submit"
                          className="w-full sm:w-auto bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm px-8 py-3 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg shadow-brand-600/30"
                        >
                          <span>Continue to Page 2</span>
                          <i data-lucide="arrow-right" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  )}

                  {/* ========================================================= */}
                  {/* PAGE 2: POLICIES & DIGITAL SIGNATURE                      */}
                  {/* ========================================================= */}
                  {}
                  {step === 2 && (
                    <div className="space-y-6">
                      
                      {/* Purpose and Policy Statement */}
                      <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-3">
                        <h3 className="font-bold text-slate-900 text-sm flex items-center">
                          <i data-lucide="shield-check" className="w-4 h-4 text-brand-600 mr-2"></i>
                          Guest Safety, Communication & Property Protocols
                        </h3>
                        <p className="text-xs text-slate-600 leading-relaxed">
                          By completing this registration, you acknowledge and agree that MO Properties may utilize your provided direct mobile contact details during your stay for essential operational and emergency purposes:
                        </p>
                        <ul className="text-xs text-slate-700 space-y-1.5 pl-4 list-disc">
                          <li><strong>Emergency Safety Responses:</strong> Urgent communication regarding fire, gas, water leaks, electrical hazards, weather, or security notifications.</li>
                          <li><strong>Maintenance Coordination:</strong> Necessary access coordination for essential property repair, HVAC, plumbing, or lock servicing.</li>
                        </ul>
                      </div>

                      {/* Explicit Consent Checkboxes */}
                      <div className="space-y-3 bg-white p-4 rounded-xl border border-slate-200">
                        <label className="flex items-start space-x-3 cursor-pointer">
                          <input
                            type="checkbox"
                            name="agreedSafetyPolicy"
                            checked={formData.agreedSafetyPolicy}
                            onChange={handleChange}
                            className="mt-0.5 rounded text-brand-600 focus:ring-brand-600"
                            required
                          />
                          <span className="text-xs text-slate-700 leading-normal">
                            I confirm that my provided mobile phone number remains active and accessible for ordinary voice and text communication throughout my stay.
                          </span>
                        </label>

                        <label className="flex items-start space-x-3 cursor-pointer">
                          <input
                            type="checkbox"
                            name="agreedMaintenancePolicy"
                            checked={formData.agreedMaintenancePolicy}
                            onChange={handleChange}
                            className="mt-0.5 rounded text-brand-600 focus:ring-brand-600"
                            required
                          />
                          <span className="text-xs text-slate-700 leading-normal">
                            I agree to adhere to all posted house rules, HOA regulations, and local safety standards applicable to MO Properties.
                          </span>
                        </label>
                      </div>

                      {/* Digital Signature Area */}
                      {}
                      <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4">
                        <div className="flex items-center justify-between border-b pb-2 border-slate-200">
                          <label className="text-xs font-bold text-slate-900 flex items-center">
                            <i data-lucide="pen-tool" className="w-4 h-4 text-brand-600 mr-2"></i>
                            Digital Signature <span className="text-rose-500 ml-1">*</span>
                          </label>
                          <div className="flex space-x-2 text-xs">
                            <button
                              type="button"
                              onClick={() => setSignatureMode('type')}
                              className={`px-2.5 py-1 rounded font-medium ${signatureMode === 'type' ? 'bg-brand-600 text-white' : 'bg-slate-200 text-slate-700'}`}
                            >
                              Type Name
                            </button>
                            <button
                              type="button"
                              onClick={() => setSignatureMode('draw')}
                              className={`px-2.5 py-1 rounded font-medium ${signatureMode === 'draw' ? 'bg-brand-600 text-white' : 'bg-slate-200 text-slate-700'}`}
                            >
                              Draw Signature
                            </button>
                          </div>
                        </div>

                        {signatureMode === 'type' ? (
                          <div>
                            <input
                              type="text"
                              name="typedSignature"
                              value={formData.typedSignature}
                              onChange={handleChange}
                              placeholder="Type full legal name to sign"
                              className="w-full text-sm font-serif italic px-3 py-3 border rounded-lg bg-white focus:ring-2 focus:ring-brand-600 focus:outline-none"
                              required
                            />
                            <p className="text-[11px] text-slate-500 mt-1">
                              Typing your full legal name serves as your binding electronic signature.
                            </p>
                          </div>
                        ) : (
                          <div className="space-y-2">
                            <div className="border border-slate-300 rounded-lg bg-white overflow-hidden">
                              <canvas
                                ref={canvasRef}
                                width={500}
                                height={120}
                                onMouseDown={startDrawing}
                                onMouseMove={draw}
                                onMouseUp={stopDrawing}
                                onMouseLeave={stopDrawing}
                               onTouchStart={startDrawing}
                               onTouchMove={draw}
                               onTouchEnd={stopDrawing}
                                className="w-full h-28 signature-canvas cursor-crosshair"
                              ></canvas>
                            </div>
                            <div className="flex justify-between items-center text-xs">
                              <span className="text-slate-500 text-[11px]">Draw signature inside the box above.</span>
                              <button
                                type="button"
                                onClick={clearSignature}
                                className="text-rose-600 hover:underline font-semibold"
                              >
                                Clear Signature
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      {/* Step Navigation Buttons */}
                      <div className="flex items-center justify-between pt-2">
                        <button
                          type="button"
                          onClick={() => setStep(1)}
                          className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-sm px-6 py-3 rounded-xl transition flex items-center space-x-2"
                        >
                          <i data-lucide="arrow-left" className="w-4 h-4"></i>
                          <span>Back to Page 1</span>
                        </button>

                        <button
                          type="submit"
                          disabled={isSubmitting}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-8 py-3 rounded-xl transition flex items-center space-x-2 shadow-lg shadow-emerald-600/30 disabled:opacity-50"
                        >
                          {isSubmitting ? (
                            <span>Submitting Check-In...</span>
                          ) : (
                            <>
                              <i data-lucide="check-circle" className="w-4 h-4"></i>
                              <span>Complete Check-In</span>
                            </>
                          )}
                        </button>
                      </div>
                    </div>
                  )}

                </form>
              </div>
            ) : (
              /* ========================================================= */
              /* SUCCESS & THANK YOU CONFIRMATION SCREEN                   */
              /* ========================================================= */
              <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-10 text-center space-y-6">
                <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto shadow-inner animate-bounce">
                  <i data-lucide="check-circle-2" className="w-10 h-10"></i>
                </div>

                <div className="space-y-2">
                  <span className="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">
                    Check-In Successful
                  </span>
                  <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 pt-2">
                    Thank You for Your Submission!
                  </h2>
                  <p className="text-sm text-slate-600 max-w-md mx-auto">
                    Thank you, <strong>{formData.primaryGuestName}</strong>. Your check-in registration and compliance agreement have been received by MO Properties.
                  </p>
                </div>

                {/* Digital Stay Access Pass Card */}
                <div className="bg-slate-900 text-white rounded-xl p-6 text-left max-w-md mx-auto shadow-2xl relative overflow-hidden">
                  <div className="absolute -right-6 -bottom-6 w-32 h-32 bg-brand-600/20 rounded-full blur-2xl"></div>
                  
                  <div className="flex justify-between items-start border-b border-slate-800 pb-3 mb-4">
                    <div>
                      <span className="text-[10px] uppercase tracking-widest text-brand-600 font-bold">Verified Check-In Pass</span>
                      <h3 className="font-bold text-base text-white">MO Properties</h3>
                    </div>
                    <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] px-2 py-0.5 rounded font-mono uppercase font-bold">
                      Confirmed
                    </span>
                  </div>

                  <div className="space-y-2 text-xs">
                    <div className="flex justify-between">
                      <span className="text-slate-400">Confirmation #:</span>
                      <span className="font-mono text-white font-bold">{formData.bookingCode || 'N/A'}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Primary Guest:</span>
                      <span className="text-white font-medium">{formData.primaryGuestName}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Mobile Phone:</span>
                      <span className="text-white font-medium">{formData.mobilePhone}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Check-In / Out:</span>
                      <span className="text-white font-medium">{formData.checkInDate} to {formData.checkOutDate}</span>
                    </div>
                    {formData.hasVehicle === 'yes' && (
                      <div className="flex justify-between pt-1 border-t border-slate-800">
                        <span className="text-slate-400">Vehicle Registered:</span>
                        <span className="text-white font-medium">{formData.vehiclePlate} ({formData.vehicleState})</span>
                      </div>
                    )}
                  </div>
                </div>

                <div className="pt-2 flex flex-col sm:flex-row justify-center gap-3">
                  <button
                    onClick={() => window.print()}
                    className="inline-flex items-center justify-center space-x-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs px-5 py-3 rounded-lg transition"
                  >
                    <i data-lucide="printer" className="w-4 h-4"></i>
                    <span>Print or Save Access Pass</span>
                  </button>
                </div>
              </div>
            )}
          </main>

          {}
          <footer className="bg-slate-900 text-slate-400 text-xs py-4 px-4 text-center border-t border-slate-800">
            <p>&copy; {new Date().getFullYear()} MO Properties Management. All Rights Reserved.</p>
          </footer>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
