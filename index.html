<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MO Properties - Guest Check-In Application</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f4f8',
              100: '#d9e2ec',
              200: '#bcccdc',
              300: '#9fb3c8',
              400: '#829ab1',
              500: '#627d98',
              600: '#486581',
              700: '#334e68',
              800: '#243b53',
              900: '#102a43',
            }
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation & View State
      const [viewMode, setViewMode] = useState('guest'); // 'guest' or 'admin'
      const [step, setStep] = useState(1);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [showPolicyModal, setShowPolicyModal] = useState(false);
      const [copySuccess, setCopySuccess] = useState('');
      const [selectedSubmission, setSelectedSubmission] = useState(null);

      // Form State - Guest Input
      const [formData, setFormData] = useState({
        bookingId: '',
        propertyName: 'Guest Stay Application',
        checkInDate: '',
        checkOutDate: '',
        // Primary Guest Information
        fullName: '',
        mobilePhone: '',
        email: '',
        // Additional Occupants
        additionalOccupants: [],
        newOccupantName: '',
        newOccupantAgeGroup: 'Adult',
        // Emergency Contact
        emergencyName: '',
        emergencyPhone: '',
        emergencyRelation: '',
        // Vehicle & Security
        hasVehicle: false,
        vehicleMakeModel: '',
        vehicleColor: '',
        vehiclePlate: '',
        // Compliance Acknowledgments
        agreeDirectContact: false,
        agreeEmergencyAlerts: false,
        agreeMaintenanceAccess: false,
        agreeHoaRules: false,
        digitalSignature: '',
        signatureDate: new Date().toISOString().split('T')[0]
      });

      // Local & Initial Stored Submissions
      const [submissions, setSubmissions] = useState([
        {
          id: 'SUB-1001',
          bookingId: 'MO-882914',
          fullName: 'Alexander Vance',
          mobilePhone: '+1 (555) 234-5678',
          email: 'a.vance@example.com',
          propertyName: 'Guest Stay Application',
          checkInDate: '2026-08-20',
          checkOutDate: '2026-08-25',
          occupantsCount: 2,
          hasVehicle: true,
          vehicleMakeModel: 'Toyota RAV4',
          vehiclePlate: '7XYZ89',
          emergencyName: 'Sarah Vance',
          emergencyPhone: '+1 (555) 987-6543',
          digitalSignature: 'Alexander Vance',
          status: 'Verified & Approved',
          submittedAt: '2026-08-16 14:22'
        }
      ]);

      // Initialize Lucide Icons on view updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [step, viewMode, isSubmitted, selectedSubmission, showPolicyModal]);

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));
      };

      const addOccupant = () => {
        if (!formData.newOccupantName.trim()) return;
        setFormData(prev => ({
          ...prev,
          additionalOccupants: [
            ...prev.additionalOccupants,
            { id: Date.now(), name: prev.newOccupantName.trim(), ageGroup: prev.newOccupantAgeGroup }
          ],
          newOccupantName: ''
        }));
      };

      const removeOccupant = (id) => {
        setFormData(prev => ({
          ...prev,
          additionalOccupants: prev.additionalOccupants.filter(o => o.id !== id)
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const submissionDate = new Date().toLocaleString();
        
        const newRecord = {
          id: 'SUB-' + Math.floor(1000 + Math.random() * 9000),
          ...formData,
          submittedAt: submissionDate,
          occupantsCount: formData.additionalOccupants.length + 1,
          status: 'Verified & Approved'
        };

        setSubmissions(prev => [newRecord, ...prev]);
        setIsSubmitted(true);
      };

      // Export Submissions to CSV (Excel format)
      const exportToCSV = () => {
        const headers = [
          'Booking Code', 'Guest Name', 'Mobile Phone', 'Email', 
          'Check-In Date', 'Check-Out Date', 'Total Guests', 
          'Vehicle Make/Model', 'Vehicle Plate', 'Emergency Contact', 
          'Emergency Phone', 'Digital Signature', 'Submission Time'
        ];

        const rows = submissions.map(s => [
          `"${s.bookingId || ''}"`,
          `"${s.fullName || ''}"`,
          `"${s.mobilePhone || ''}"`,
          `"${s.email || ''}"`,
          `"${s.checkInDate || ''}"`,
          `"${s.checkOutDate || ''}"`,
          `"${s.occupantsCount || 1}"`,
          `"${s.vehicleMakeModel || 'None'}"`,
          `"${s.vehiclePlate || 'None'}"`,
          `"${s.emergencyName || 'None'}"`,
          `"${s.emergencyPhone || 'None'}"`,
          `"${s.digitalSignature || ''}"`,
          `"${s.submittedAt || ''}"`
        ]);

        const csvContent = 'data:text/csv;charset=utf-8,' 
          + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `MO_Properties_Guest_Checkins_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Export Submissions to JSON
      const exportToJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(submissions, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `MO_Properties_Checkins_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      // Copy All Data to Clipboard in Text Format
      const copyAllDataToClipboard = () => {
        const textSummary = submissions.map((s, idx) => 
          `--- GUEST #${idx + 1} ---
Booking Code: ${s.bookingId}
Name: ${s.fullName}
Phone: ${s.mobilePhone}
Email: ${s.email}
Dates: ${s.checkInDate} to ${s.checkOutDate}
Guests: ${s.occupantsCount}
Vehicle: ${s.hasVehicle ? `${s.vehicleMakeModel} (${s.vehiclePlate})` : 'No Vehicle'}
Emergency Contact: ${s.emergencyName || 'N/A'} (${s.emergencyPhone || 'N/A'})
Submitted: ${s.submittedAt}
`
        ).join('\n\n');

        const textarea = document.createElement('textarea');
        textarea.value = textSummary;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);

        setCopySuccess('Copied all guest data to clipboard!');
        setTimeout(() => setCopySuccess(''), 3000);
      };

      // Check for masked/relay phone numbers
      const isRelayPhone = formData.mobilePhone.toLowerCase().includes('relay') || 
                           formData.mobilePhone.toLowerCase().includes('airbnb') ||
                           formData.mobilePhone.includes('@');

      // Validation logic for form wizard
      const canProceedStep1 = formData.fullName.trim() !== '' && 
                              formData.email.trim() !== '' && 
                              formData.mobilePhone.trim() !== '' &&
                              formData.bookingId.trim() !== '' &&
                              formData.checkInDate !== '' &&
                              formData.checkOutDate !== '' &&
                              !isRelayPhone;

      const canProceedStep2 = true;
      const canProceedStep3 = !formData.hasVehicle || (formData.vehicleMakeModel && formData.vehiclePlate);
      const canProceedStep4 = formData.agreeDirectContact && 
                              formData.agreeEmergencyAlerts && 
                              formData.agreeMaintenanceAccess && 
                              formData.agreeHoaRules && 
                              formData.digitalSignature.trim() !== '';

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          <header className="bg-brand-900 text-white shadow-lg sticky top-0 z-40">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-amber-400 text-brand-900 font-black px-2.5 py-1 rounded text-lg tracking-wider">
                  MO
                </div>
                <div>
                  <h1 className="font-bold text-base md:text-lg leading-tight">MO Properties</h1>
                  <p className="text-xs text-slate-300">Guest Safety & Compliance Portal</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <button
                  onClick={() => setShowPolicyModal(true)}
                  className="hidden md:inline-flex items-center text-xs bg-brand-800 hover:bg-brand-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition"
                >
                  <i data-lucide="file-text" className="w-3.5 h-3.5 mr-1.5"></i>
                  View Policy Doc
                </button>

                <div className="bg-brand-800 p-1 rounded-lg border border-slate-700 flex text-xs font-medium">
                  <button
                    onClick={() => setViewMode('guest')}
                    className={`px-3 py-1 rounded-md transition ${viewMode === 'guest' ? 'bg-amber-400 text-brand-900 font-bold shadow' : 'text-slate-300 hover:text-white'}`}
                  >
                    Guest Check-In
                  </button>
                  <button
                    onClick={() => setViewMode('admin')}
                    className={`px-3 py-1 rounded-md transition ${viewMode === 'admin' ? 'bg-amber-400 text-brand-900 font-bold shadow' : 'text-slate-300 hover:text-white'}`}
                  >
                    Host Admin ({submissions.length})
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="max-w-5xl mx-auto w-full px-4 py-6 flex-grow">

            {/* POLICY DOCUMENT MODAL */}
            {showPolicyModal && (
              <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden border border-slate-200">
                  <div className="p-4 bg-brand-900 text-white flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-lg">MO Properties Compliance Policy</h3>
                      <p className="text-xs text-slate-300">Document Owner: MO Properties | Effective: Jan 1, 2026</p>
                    </div>
                    <button onClick={() => setShowPolicyModal(false)} className="text-slate-300 hover:text-white">
                      <i data-lucide="x" className="w-6 h-6"></i>
                    </button>
                  </div>
                  <div className="p-6 overflow-y-auto text-sm space-y-4 text-slate-700 leading-relaxed">
                    <div className="bg-amber-50 border-l-4 border-amber-500 p-3 rounded text-amber-900 text-xs font-medium">
                      <strong>CORE REQUIREMENT:</strong> A reliable direct means of contacting the primary guest must be available throughout the period of occupancy.
                    </div>
                    <h4 className="font-bold text-brand-900 border-b pb-1">1. Purpose and Policy Basis</h4>
                    <p>These procedures establish MO Properties' minimum guest identification, communication, access, and emergency-contact requirements across all properties and stays subject to MO Properties management. Reliable guest contact info is required so hosts, co-hosts, HOA, security, and emergency responders can coordinate with occupants.</p>
                    
                    <h4 className="font-bold text-brand-900 border-b pb-1">2. Required Guest Information</h4>
                    <p>Before check-in, primary guests must provide:</p>
                    <ul className="list-disc pl-5 space-y-1">
                      <li>Full legal name of the primary guest.</li>
                      <li>Current direct mobile telephone number (active for ordinary calls & text messages during stay).</li>
                      <li>Current email address.</li>
                      <li>Names of additional adult occupants when required.</li>
                      <li>Vehicle and parking details where applicable.</li>
                    </ul>
                    <p className="text-xs text-rose-700 bg-rose-50 p-2 rounded font-medium">
                      Note: A temporary, masked, proxy, forwarding, or platform-generated relay number (e.g. Airbnb masked relay) may be used as an additional channel, but DOES NOT replace a direct working mobile number required for safety, maintenance, and compliance.
                    </p>

                    <h4 className="font-bold text-brand-900 border-b pb-1">3. Communication & Emergency Contact</h4>
                    <p>Direct contact info may be used for stay-related communications including:</p>
                    <ul className="list-disc pl-5 space-y-1">
                      <li>Fire, smoke, gas, water, electrical, medical, security, evacuation, or urgent safety matters.</li>
                      <li>HVAC, plumbing, electrical, appliance, lock, or other maintenance/repair coordination.</li>
                    </ul>
                  </div>
                  <div className="p-4 bg-slate-50 border-t flex justify-end">
                    <button
                      onClick={() => setShowPolicyModal(false)}
                      className="bg-brand-700 text-white px-5 py-2 rounded-lg font-medium hover:bg-brand-800 transition"
                    >
                      Close & Understand
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* GUEST DETAIL INSPECTOR MODAL */}
            {selectedSubmission && (
              <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden border border-slate-200">
                  <div className="p-4 bg-brand-900 text-white flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-base">Guest Check-In Entry Details</h3>
                      <p className="text-xs text-slate-300">Confirmation Code: {selectedSubmission.bookingId}</p>
                    </div>
                    <button onClick={() => setSelectedSubmission(null)} className="text-slate-300 hover:text-white">
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  <div className="p-6 overflow-y-auto space-y-4 text-xs">
                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1">
                      <p className="font-bold text-slate-800 text-sm">{selectedSubmission.fullName}</p>
                      <p className="text-slate-600"><strong>Mobile Phone:</strong> {selectedSubmission.mobilePhone}</p>
                      <p className="text-slate-600"><strong>Email:</strong> {selectedSubmission.email}</p>
                      <p className="text-slate-600"><strong>Stay Dates:</strong> {selectedSubmission.checkInDate} to {selectedSubmission.checkOutDate}</p>
                    </div>

                    <div className="border border-slate-200 p-3 rounded-xl space-y-1">
                      <p className="font-bold text-slate-800">Occupants & Emergency Info</p>
                      <p className="text-slate-600"><strong>Total Occupants:</strong> {selectedSubmission.occupantsCount}</p>
                      <p className="text-slate-600"><strong>Emergency Contact:</strong> {selectedSubmission.emergencyName || 'N/A'} ({selectedSubmission.emergencyPhone || 'N/A'})</p>
                    </div>

                    <div className="border border-slate-200 p-3 rounded-xl space-y-1">
                      <p className="font-bold text-slate-800">Vehicle & Access</p>
                      <p className="text-slate-600"><strong>Vehicle:</strong> {selectedSubmission.hasVehicle ? `${selectedSubmission.vehicleMakeModel} (${selectedSubmission.vehiclePlate})` : 'No Vehicle Registered'}</p>
                    </div>

                    <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl space-y-1 text-emerald-900">
                      <p className="font-bold">Compliance Verification</p>
                      <p><strong>Digital Signature:</strong> {selectedSubmission.digitalSignature}</p>
                      <p><strong>Submitted At:</strong> {selectedSubmission.submittedAt}</p>
                    </div>
                  </div>

                  <div className="p-4 bg-slate-50 border-t flex justify-end">
                    <button
                      onClick={() => setSelectedSubmission(null)}
                      className="bg-brand-700 text-white px-4 py-2 rounded-lg font-medium hover:bg-brand-800 transition text-xs"
                    >
                      Close Window
                    </button>
                  </div>
                </div>
              </div>
            )}

            {viewMode === 'admin' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-900">Host Data & Compliance Dashboard</h2>
                      <p className="text-sm text-slate-500">Pull, view, and export guest check-in submissions in real-time</p>
                    </div>

                    {/* DATA EXPORT TOOLBAR */}
                    <div className="flex flex-wrap items-center gap-2">
                      <button
                        onClick={exportToCSV}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center shadow transition"
                        title="Download as Excel/CSV Spreadsheet"
                      >
                        <i data-lucide="download" className="w-3.5 h-3.5 mr-1.5"></i>
                        Export CSV (Excel)
                      </button>

                      <button
                        onClick={copyAllDataToClipboard}
                        className="bg-brand-700 hover:bg-brand-800 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center shadow transition"
                        title="Copy text summary to clipboard"
                      >
                        <i data-lucide="copy" className="w-3.5 h-3.5 mr-1.5"></i>
                        Copy All Text
                      </button>

                      <button
                        onClick={exportToJSON}
                        className="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-xl text-xs font-medium flex items-center transition"
                      >
                        <i data-lucide="file-code" className="w-3.5 h-3.5 mr-1.5"></i>
                        JSON
                      </button>
                    </div>
                  </div>

                  {copySuccess && (
                    <div className="mb-4 p-3 bg-emerald-100 border border-emerald-300 text-emerald-900 text-xs font-bold rounded-xl flex items-center">
                      <i data-lucide="check-circle" className="w-4 h-4 mr-2 text-emerald-600"></i>
                      {copySuccess}
                    </div>
                  )}

                  {/* Summary Metric Cards */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                      <p className="text-xs text-slate-500 font-medium">Total Check-Ins Recieved</p>
                      <p className="text-2xl font-bold text-brand-900">{submissions.length}</p>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                      <p className="text-xs text-slate-500 font-medium">Direct Mobile Numbers On File</p>
                      <p className="text-2xl font-bold text-emerald-600">100% Verified</p>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                      <p className="text-xs text-slate-500 font-medium">Data Sync Status</p>
                      <p className="text-2xl font-bold text-blue-600 flex items-center">
                        <span className="w-2.5 h-2.5 bg-emerald-500 rounded-full mr-2 animate-pulse"></span>
                        Active
                      </p>
                    </div>
                  </div>

                  {/* Submissions Data Table */}
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-100 text-slate-700 text-xs uppercase font-semibold">
                        <tr>
                          <th className="p-3 rounded-l-lg">Booking Code</th>
                          <th className="p-3">Primary Guest</th>
                          <th className="p-3">Direct Contact</th>
                          <th className="p-3">Stay Dates</th>
                          <th className="p-3">Occupants / Vehicle</th>
                          <th className="p-3 rounded-r-lg">Actions / Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {submissions.map((sub, idx) => (
                          <tr key={sub.id || idx} className="hover:bg-slate-50/80 transition">
                            <td className="p-3 font-mono text-xs text-slate-600">
                              <span className="font-bold text-slate-900">{sub.bookingId}</span>
                              <div className="text-[10px] text-slate-400">{sub.submittedAt}</div>
                            </td>
                            <td className="p-3 font-semibold text-slate-900">{sub.fullName}</td>
                            <td className="p-3">
                              <div className="font-semibold text-brand-700">{sub.mobilePhone}</div>
                              <div className="text-xs text-slate-500">{sub.email}</div>
                            </td>
                            <td className="p-3 text-xs text-slate-600">
                              <div className="font-medium text-slate-800">{sub.checkInDate || 'N/A'}</div>
                              <div className="text-[10px] text-slate-400">to {sub.checkOutDate || 'N/A'}</div>
                            </td>
                            <td className="p-3 text-xs">
                              <div>{sub.occupantsCount || 1} Guests</div>
                              <div className="text-slate-500">{sub.hasVehicle ? `Vehicle (${sub.vehiclePlate})` : 'No Vehicle'}</div>
                            </td>
                            <td className="p-3">
                              <div className="flex items-center space-x-2">
                                <button
                                  onClick={() => setSelectedSubmission(sub)}
                                  className="px-2.5 py-1 bg-brand-50 text-brand-700 hover:bg-brand-100 text-xs font-semibold rounded-lg border border-brand-200 transition"
                                >
                                  View Full Entry
                                </button>
                                <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-100 text-emerald-800">
                                  Verified
                                </span>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                </div>
              </div>
            )}

            {viewMode === 'guest' && (
              <div>
                {!isSubmitted ? (
                  <div className="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                    
                    {/* Header Banner */}
                    <div className="bg-gradient-to-r from-brand-900 via-brand-800 to-slate-900 text-white p-6 md:p-8">
                      <div className="max-w-3xl">
                        <span className="bg-amber-400/20 text-amber-300 border border-amber-400/30 text-xs px-3 py-1 rounded-full font-medium inline-block mb-3">
                          Mandatory Pre-Arrival Check-In
                        </span>
                        <h2 className="text-2xl md:text-3xl font-extrabold tracking-tight">Guest Registration & Compliance</h2>
                        <p className="text-slate-300 text-sm mt-1">Please complete this registration prior to check-in to receive door codes and building access instructions.</p>
                      </div>

                      {/* Progress Bar */}
                      <div className="mt-6 pt-6 border-t border-slate-700/60 grid grid-cols-4 gap-2 text-center text-xs">
                        <div className={`p-2 rounded-lg font-medium transition ${step === 1 ? 'bg-amber-400 text-brand-900 font-bold' : step > 1 ? 'bg-brand-700 text-slate-200' : 'bg-brand-800/50 text-slate-400'}`}>
                          1. Guest & Dates
                        </div>
                        <div className={`p-2 rounded-lg font-medium transition ${step === 2 ? 'bg-amber-400 text-brand-900 font-bold' : step > 2 ? 'bg-brand-700 text-slate-200' : 'bg-brand-800/50 text-slate-400'}`}>
                          2. Occupants
                        </div>
                        <div className={`p-2 rounded-lg font-medium transition ${step === 3 ? 'bg-amber-400 text-brand-900 font-bold' : step > 3 ? 'bg-brand-700 text-slate-200' : 'bg-brand-800/50 text-slate-400'}`}>
                          3. Parking
                        </div>
                        <div className={`p-2 rounded-lg font-medium transition ${step === 4 ? 'bg-amber-400 text-brand-900 font-bold' : 'bg-brand-800/50 text-slate-400'}`}>
                          4. Compliance
                        </div>
                      </div>
                    </div>

                    {/* Step Form Container */}
                    <form onSubmit={handleSubmit} className="p-6 md:p-8 space-y-6">

                      {/* STEP 1: Reservation Code, Dates, and Primary Guest Info */}
                      {step === 1 && (
                        <div className="space-y-6 animate-fadeIn">
                          <div className="border-b pb-3">
                            <h3 className="text-lg font-bold text-brand-900 flex items-center">
                              <i data-lucide="user-check" className="w-5 h-5 mr-2 text-brand-700"></i>
                              Reservation Details & Primary Guest Contact
                            </h3>
                            <p className="text-xs text-slate-500">Please enter your booking confirmation code, check-in dates, and direct contact number.</p>
                          </div>

                          {/* Reservation Code & Dates Row */}
                          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">
                                Booking / Confirmation Code <span className="text-rose-500">*</span>
                              </label>
                              <input
                                type="text"
                                name="bookingId"
                                value={formData.bookingId}
                                onChange={handleChange}
                                placeholder="e.g. MO-882914 or HM12345"
                                className="w-full text-sm font-mono uppercase px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-700 focus:outline-none"
                                required
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">
                                Check-In Date <span className="text-rose-500">*</span>
                              </label>
                              <input
                                type="date"
                                name="checkInDate"
                                value={formData.checkInDate}
                                onChange={handleChange}
                                className="w-full text-sm px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-700 focus:outline-none"
                                required
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">
                                Check-Out Date <span className="text-rose-500">*</span>
                              </label>
                              <input
                                type="date"
                                name="checkOutDate"
                                value={formData.checkOutDate}
                                onChange={handleChange}
                                className="w-full text-sm px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-700 focus:outline-none"
                                required
                              />
                            </div>
                          </div>

                          {/* Primary Contact Info */}
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="md:col-span-2">
                              <label className="block text-xs font-bold text-slate-700 mb-1">
                                Full Legal Name of Primary Guest <span className="text-rose-500">*</span>
                              </label>
                              <input
                                type="text"
                                name="fullName"
                                value={formData.fullName}
                                onChange={handleChange}
                                placeholder="e.g. Jane Elizabeth Doe"
                                className="w-full text-sm px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-brand-700 focus:outline-none"
                                required
                              />
                            </div>

                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">
                                Direct Personal Mobile Phone <span className="text-rose-500">*</span>
                              </label>
                              <input
                                type="tel"
                                name="mobilePhone"
                                value={formData.mobilePhone}
                                onChange={handleChange}
                                placeholder="e.g. +1 (555) 019-2834"
                                className={`w-full text-sm px-3 py-2.5 border rounded-lg focus:ring-2 focus:outline-none ${isRelayPhone ? 'border-rose-500 bg-rose-50' : 'focus:ring-brand-700'}`}
                                required
                              />
                            </div>

                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">
                                Email Address <span className="text-rose-500">*</span>
                              </label>
                              <input
                                type="email"
                                name="email"
                                value={formData.email}
                                onChange={handleChange}
                                placeholder="e.g. guest@example.com"
                                className="w-full text-sm px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-brand-700 focus:outline-none"
                                required
                              />
                            </div>
                          </div>

                          {/* Direct Mobile Requirement Policy Warning Banner */}
                          {isRelayPhone ? (
                            <div className="bg-rose-50 border-l-4 border-rose-500 p-4 rounded-r-xl space-y-2">
                              <div className="flex items-center text-rose-900 font-bold text-xs">
                                <i data-lucide="alert-triangle" className="w-4 h-4 mr-2 text-rose-600"></i>
                                Direct Mobile Phone Required (Relay Numbers Not Allowed)
                              </div>
                              <p className="text-xs text-rose-800 leading-relaxed">
                                Our safety regulations require a direct personal mobile number capable of receiving voice calls and SMS text messages. Platform-masked or relay email addresses cannot be used as the primary emergency contact method.
                              </p>
                            </div>
                          ) : (
                            <div className="bg-amber-50/80 border border-amber-200 p-3.5 rounded-xl text-xs text-amber-900 flex items-start space-x-2">
                              <i data-lucide="shield-alert" className="w-4 h-4 text-amber-600 mt-0.5 flex-shrink-0"></i>
                              <div>
                                <strong>Safety Notice:</strong> Your direct mobile number will be kept strictly confidential and used solely for stay-related emergency alerts, lock updates, or maintenance requests.
                              </div>
                            </div>
                          )}

                          <div className="flex justify-end pt-4">
                            <button
                              type="button"
                              onClick={() => setStep(2)}
                              disabled={!canProceedStep1}
                              className={`px-6 py-2.5 rounded-xl text-xs font-bold flex items-center transition ${canProceedStep1 ? 'bg-brand-800 hover:bg-brand-900 text-white shadow-md' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                            >
                              Next Step: Additional Occupants
                              <i data-lucide="arrow-right" className="w-4 h-4 ml-2"></i>
                            </button>
                          </div>
                        </div>
                      )}

                      {/* STEP 2: Occupants & Emergency Contact */}
                      {step === 2 && (
                        <div className="space-y-6 animate-fadeIn">
                          <div className="border-b pb-3">
                            <h3 className="text-lg font-bold text-brand-900 flex items-center">
                              <i data-lucide="users" className="w-5 h-5 mr-2 text-brand-700"></i>
                              Additional Occupants & Emergency Contact
                            </h3>
                            <p className="text-xs text-slate-500">List all persons staying on the property and provide one off-site emergency contact.</p>
                          </div>

                          {/* Add Occupants */}
                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                            <label className="block text-xs font-bold text-slate-800">
                              Additional Occupants (Other than Primary Guest)
                            </label>
                            <div className="flex gap-2">
                              <input
                                type="text"
                                value={formData.newOccupantName}
                                onChange={(e) => setFormData({...formData, newOccupantName: e.target.value})}
                                placeholder="Full Name of Occupant"
                                className="flex-grow text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-700 focus:outline-none"
                              />
                              <select
                                value={formData.newOccupantAgeGroup}
                                onChange={(e) => setFormData({...formData, newOccupantAgeGroup: e.target.value})}
                                className="text-xs border rounded-lg px-2 py-2 bg-white focus:outline-none"
                              >
                                <option value="Adult">Adult (18+)</option>
                                <option value="Minor">Minor (Under 18)</option>
                              </select>
                              <button
                                type="button"
                                onClick={addOccupant}
                                className="bg-brand-700 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-brand-800 transition"
                              >
                                Add Guest
                              </button>
                            </div>

                            {/* List of Added Occupants */}
                            {formData.additionalOccupants.length > 0 && (
                              <div className="mt-3 space-y-1">
                                {formData.additionalOccupants.map((occ) => (
                                  <div key={occ.id} className="flex justify-between items-center bg-white p-2.5 rounded-lg border text-xs">
                                    <span className="font-semibold text-slate-800">{occ.name} <span className="text-slate-400 font-normal">({occ.ageGroup})</span></span>
                                    <button
                                      type="button"
                                      onClick={() => removeOccupant(occ.id)}
                                      className="text-rose-600 hover:text-rose-800 font-bold"
                                    >
                                      Remove
                                    </button>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>

                          {/* Emergency Contact Info */}
                          <div className="border border-slate-200 p-4 rounded-xl space-y-3">
                            <h4 className="text-xs font-bold text-slate-800 uppercase tracking-wider">Off-Site Emergency Contact</h4>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                              <div>
                                <label className="block text-xs font-medium text-slate-700 mb-1">Contact Name</label>
                                <input
                                  type="text"
                                  name="emergencyName"
                                  value={formData.emergencyName}
                                  onChange={handleChange}
                                  placeholder="e.g. Sarah Vance"
                                  className="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none"
                                />
                              </div>
                              <div>
                                <label className="block text-xs font-medium text-slate-700 mb-1">Contact Phone Number</label>
                                <input
                                  type="tel"
                                  name="emergencyPhone"
                                  value={formData.emergencyPhone}
                                  onChange={handleChange}
                                  placeholder="e.g. +1 (555) 987-6543"
                                  className="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none"
                                />
                              </div>
                            </div>
                          </div>

                          <div className="flex justify-between pt-4">
                            <button
                              type="button"
                              onClick={() => setStep(1)}
                              className="px-5 py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition"
                            >
                              Back
                            </button>
                            <button
                              type="button"
                              onClick={() => setStep(3)}
                              className="px-6 py-2.5 rounded-xl text-xs font-bold bg-brand-800 hover:bg-brand-900 text-white shadow-md flex items-center transition"
                            >
                              Next Step: Parking
                              <i data-lucide="arrow-right" className="w-4 h-4 ml-2"></i>
                            </button>
                          </div>
                        </div>
                      )}

                      {/* STEP 3: Vehicle Registration */}
                      {step === 3 && (
                        <div className="space-y-6 animate-fadeIn">
                          <div className="border-b pb-3">
                            <h3 className="text-lg font-bold text-brand-900 flex items-center">
                              <i data-lucide="car" className="w-5 h-5 mr-2 text-brand-700"></i>
                              Vehicle & Parking Registration
                            </h3>
                            <p className="text-xs text-slate-500">Provide vehicle details for parking permits and gated access coordination.</p>
                          </div>

                          {/* Vehicle Toggle & Details */}
                          <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4">
                            <div className="flex items-center justify-between">
                              <div>
                                <label className="text-xs font-bold text-slate-800 block">Will you have a vehicle on-site?</label>
                                <p className="text-[11px] text-slate-500">Required for parking permits and gated access coordination.</p>
                              </div>
                              <input
                                type="checkbox"
                                name="hasVehicle"
                                checked={formData.hasVehicle}
                                onChange={handleChange}
                                className="w-5 h-5 text-brand-700 rounded border-slate-300 focus:ring-brand-700 cursor-pointer"
                              />
                            </div>

                            {formData.hasVehicle ? (
                              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-3 border-t border-slate-200">
                                <div>
                                  <label className="block text-xs font-medium text-slate-700 mb-1">
                                    Vehicle Make & Model <span className="text-rose-500">*</span>
                                  </label>
                                  <input
                                    type="text"
                                    name="vehicleMakeModel"
                                    value={formData.vehicleMakeModel}
                                    onChange={handleChange}
                                    placeholder="e.g. Toyota RAV4 (Silver)"
                                    className="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none"
                                    required={formData.hasVehicle}
                                  />
                                </div>
                                <div>
                                  <label className="block text-xs font-medium text-slate-700 mb-1">
                                    License Plate Number <span className="text-rose-500">*</span>
                                  </label>
                                  <input
                                    type="text"
                                    name="vehiclePlate"
                                    value={formData.vehiclePlate}
                                    onChange={handleChange}
                                    placeholder="e.g. 7XYZ89"
                                    className="w-full text-xs uppercase px-3 py-2 border rounded-lg focus:outline-none"
                                    required={formData.hasVehicle}
                                  />
                                </div>
                              </div>
                            ) : (
                              <div className="p-3 bg-white rounded-lg border text-slate-500 text-xs text-center">
                                No vehicle selected. You can proceed to the next step.
                              </div>
                            )}
                          </div>

                          <div className="flex justify-between pt-4">
                            <button
                              type="button"
                              onClick={() => setStep(2)}
                              className="px-5 py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition"
                            >
                              Back
                            </button>
                            <button
                              type="button"
                              onClick={() => setStep(4)}
                              disabled={!canProceedStep3}
                              className={`px-6 py-2.5 rounded-xl text-xs font-bold flex items-center transition ${canProceedStep3 ? 'bg-brand-800 hover:bg-brand-900 text-white shadow-md' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                            >
                              Next Step: Compliance & Sign
                              <i data-lucide="arrow-right" className="w-4 h-4 ml-2"></i>
                            </button>
                          </div>
                        </div>
                      )}

                      {/* STEP 4: Policy Acknowledgments & Digital Signature */}
                      {step === 4 && (
                        <div className="space-y-6 animate-fadeIn">
                          <div className="border-b pb-3">
                            <h3 className="text-lg font-bold text-brand-900 flex items-center">
                              <i data-lucide="shield-check" className="w-5 h-5 mr-2 text-brand-700"></i>
                              Compliance Acknowledgments & Digital Signature
                            </h3>
                            <p className="text-xs text-slate-500">Please review and confirm compliance with MO Properties procedures.</p>
                          </div>

                          {/* Checkbox Acknowledgments */}
                          <div className="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs">
                            
                            <label className="flex items-start space-x-3 cursor-pointer">
                              <input
                                type="checkbox"
                                name="agreeDirectContact"
                                checked={formData.agreeDirectContact}
                                onChange={handleChange}
                                className="mt-0.5 w-4 h-4 text-brand-700 rounded border-slate-300 focus:ring-brand-700"
                              />
                              <span className="text-slate-700 leading-snug">
                                <strong>Direct Contact Requirement:</strong> I certify that the mobile phone provided is a direct, active personal line capable of receiving voice calls and text messages throughout my stay.
                              </span>
                            </label>

                            <label className="flex items-start space-x-3 cursor-pointer">
                              <input
                                type="checkbox"
                                name="agreeEmergencyAlerts"
                                checked={formData.agreeEmergencyAlerts}
                                onChange={handleChange}
                                className="mt-0.5 w-4 h-4 text-brand-700 rounded border-slate-300 focus:ring-brand-700"
                              />
                              <span className="text-slate-700 leading-snug">
                                <strong>Safety & Emergency Communications:</strong> I consent to receive urgent stay alerts regarding fire, smoke, water leaks, severe weather, evacuation, or security protocols.
                              </span>
                            </label>

                            <label className="flex items-start space-x-3 cursor-pointer">
                              <input
                                type="checkbox"
                                name="agreeMaintenanceAccess"
                                checked={formData.agreeMaintenanceAccess}
                                onChange={handleChange}
                                className="mt-0.5 w-4 h-4 text-brand-700 rounded border-slate-300 focus:ring-brand-700"
                              />
                              <span className="text-slate-700 leading-snug">
                                <strong>Maintenance Access:</strong> I understand that authorized property management or vendors may contact me for necessary repairs or maintenance during my stay.
                              </span>
                            </label>

                            <label className="flex items-start space-x-3 cursor-pointer">
                              <input
                                type="checkbox"
                                name="agreeHoaRules"
                                checked={formData.agreeHoaRules}
                                onChange={handleChange}
                                className="mt-0.5 w-4 h-4 text-brand-700 rounded border-slate-300 focus:ring-brand-700"
                              />
                              <span className="text-slate-700 leading-snug">
                                <strong>HOA & House Rules Compliance:</strong> I agree to comply with quiet hours, parking rules, trash disposal, maximum occupancy limits, and property policies.
                              </span>
                            </label>

                          </div>

                          {/* Digital Signature */}
                          <div className="border border-slate-200 p-4 rounded-xl space-y-3">
                            <label className="block text-xs font-bold text-slate-800">
                              Digital Signature <span className="text-rose-500">*</span>
                            </label>
                            <p className="text-[11px] text-slate-500">Type your full legal name below as your binding digital signature.</p>

                            <input
                              type="text"
                              name="digitalSignature"
                              value={formData.digitalSignature}
                              onChange={handleChange}
                              placeholder="Type Full Name to Sign"
                              className="w-full text-sm font-serif italic px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-brand-700 focus:outline-none bg-slate-50"
                              required
                            />

                            <div className="flex justify-between items-center text-[11px] text-slate-400">
                              <span>Signing Date: {formData.signatureDate}</span>
                              <span>IP & Verification Stamp Logged</span>
                            </div>
                          </div>

                          <div className="flex justify-between pt-4">
                            <button
                              type="button"
                              onClick={() => setStep(3)}
                              className="px-5 py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition"
                            >
                              Back
                            </button>
                            <button
                              type="submit"
                              disabled={!canProceedStep4}
                              className={`px-8 py-3 rounded-xl text-xs font-bold transition shadow-lg ${canProceedStep4 ? 'bg-amber-500 hover:bg-amber-600 text-brand-900 cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                            >
                              Complete Pre-Arrival Registration
                            </button>
                          </div>
                        </div>
                      )}

                    </form>
                  </div>
                ) : (
                  /* SUCCESS VIEW - CONFIRMATION CARD */
                  <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center space-y-6 max-w-2xl mx-auto animate-fadeIn">
                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
                      <i data-lucide="check-circle-2" className="w-10 h-10"></i>
                    </div>

                    <div className="space-y-2">
                      <h2 className="text-2xl font-bold text-slate-900">Registration Complete!</h2>
                      <p className="text-xs text-slate-600">Your check-in details have been logged and verified by MO Properties management.</p>
                    </div>

                    {/* Pass Card */}
                    <div className="bg-brand-900 text-white rounded-2xl p-6 text-left shadow-lg relative overflow-hidden">
                      <div className="absolute -right-10 -bottom-10 opacity-10 text-white">
                        <i data-lucide="shield-check" className="w-48 h-48"></i>
                      </div>

                      <div className="flex justify-between items-start border-b border-brand-800 pb-4 mb-4">
                        <div>
                          <p className="text-[10px] uppercase text-amber-400 font-bold tracking-wider">Verified Guest Access Pass</p>
                          <h3 className="text-lg font-bold">{formData.fullName}</h3>
                        </div>
                        <div className="text-right">
                          <span className="text-[10px] text-slate-400 block">Confirmation</span>
                          <span className="font-mono text-xs font-bold text-amber-300">{formData.bookingId}</span>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4 text-xs">
                        <div>
                          <span className="text-[10px] text-slate-400 block">Check-In Date</span>
                          <span className="font-medium text-slate-200">{formData.checkInDate || 'On File'}</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block">Check-Out Date</span>
                          <span className="font-medium text-slate-200">{formData.checkOutDate || 'On File'}</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block">Contact Phone</span>
                          <span className="font-medium text-slate-200">{formData.mobilePhone}</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block">Registered Guests</span>
                          <span className="font-medium text-slate-200">{formData.additionalOccupants.length + 1} Total</span>
                        </div>
                      </div>
                    </div>

                    <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl text-left text-xs space-y-2">
                      <p className="font-bold text-slate-800">What Happens Next?</p>
                      <ul className="list-disc pl-5 space-y-1 text-slate-600">
                        <li>Your property access codes will be sent via text message to <strong>{formData.mobilePhone}</strong> prior to check-in.</li>
                        <li>If you need assistance, contact host support directly.</li>
                      </ul>
                    </div>

                    <button
                      onClick={() => {
                        setIsSubmitted(false);
                        setStep(1);
                      }}
                      className="text-xs text-brand-700 hover:text-brand-900 font-bold underline"
                    >
                      Submit Another Check-In Registration
                    </button>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800">
            <div className="max-w-5xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center space-y-3 md:space-y-0">
              <p>© 2026 MO Properties Management. All rights reserved.</p>
              <div className="flex space-x-4">
                <button onClick={() => setShowPolicyModal(true)} className="hover:text-slate-200 transition">
                  Compliance Policy
                </button>
                <span>•</span>
                <span>Safety & Security Standards</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
